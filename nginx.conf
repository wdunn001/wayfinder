# Wayfinder, serve the SPA and proxy every geo backend under this origin
# (same-origin => no browser CORS, no dependency on public DNS).
#
# This file is an envsubst TEMPLATE (nginx docker entrypoint): every ${VAR} below
# is substituted from the container environment at startup, the backend upstream
# hosts (${TILES_UPSTREAM}, ${OSRM_UPSTREAM}, …), the TomTom key/referer, and the
# NWS contact. Set them via --env-file (see .env.example). nginx runtime vars
# ($host, $uri, $args, $1…) are NOT env vars, so envsubst leaves them untouched.
#
# Point each *_UPSTREAM at a "host:port" that this container can reach. Using a
# literal IP:port (rather than a DNS name) means nginx never blocks on upstream
# DNS at startup. The internet upstreams (TomTom, AWS DEM, NWS) use the
# resolver-variable pattern so a dead DNS / upstream can never take the server
# down at boot. nginx starts fine offline and those features just error until
# reachable.

# Short-TTL cache for TomTom flow-segment lookups: route evaluation samples
# many nearby points; caching per rounded coordinate keeps daily API usage low.
proxy_cache_path /var/cache/nginx/tomtomflow levels=1:2 keys_zone=tomtomflow:2m max_size=20m inactive=10m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Raster basemap / satellite tiles, big & immutable-ish, so let the browser
  # cache hard. Point ${TILES_UPSTREAM} at your tile server (e.g. a TileServer-GL
  # or a static tile cache).
  location /tiles/ {
    proxy_pass http://${TILES_UPSTREAM}/;
    proxy_set_header Host $host;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "public, max-age=604800";
  }

  # Martin vector tiles, planet basemap whose `buildings` layer carries
  # height/min_height for 3D fill-extrusion. Point ${MARTIN_UPSTREAM} at your
  # Martin vector-tile server.
  location /martin/ {
    proxy_pass http://${MARTIN_UPSTREAM}/;
    proxy_set_header Host $host;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "public, max-age=604800";
  }

  # PRIMARY geocoder: self-hosted Nominatim (street addresses with house
  # numbers). The app tries this first and falls back to Photon below, so this
  # location can 502 harmlessly until your Nominatim import finishes serving.
  location /nominatim/ {
    proxy_pass http://${NOMINATIM_UPSTREAM}/;
    proxy_set_header Host $host;
    proxy_read_timeout 20s;
  }

  # FALLBACK geocoder: Photon (place names; weaker on house numbers). Generous
  # timeout: while a Nominatim import runs, Photon's disk can be contended and
  # responses take 10-20s, better slow suggestions than timeouts.
  location /geocode/ {
    proxy_pass http://${PHOTON_UPSTREAM}/;
    proxy_set_header Host $host;
    proxy_read_timeout 45s;
  }

  # OSRM routing engine (route + trip). Point ${OSRM_UPSTREAM} at your OSRM
  # backend serving the region you care about.
  location /route/ {
    proxy_pass http://${OSRM_UPSTREAM}/;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
  }

  # Live traffic overlay, TomTom raster flow tiles (free tier: 50k tiles/day).
  # Same-origin so the API key never reaches the browser; key comes from the
  # container env (TOMTOM_API_KEY). Variable upstream + resolver = lazy DNS,
  # so nginx starts fine offline; the toggle just gets errors until reachable.
  location ~ ^/traffic/(\d+)/(\d+)/(\d+)\.png$ {
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $tomtom api.tomtom.com;
    proxy_pass https://$tomtom/traffic/map/4/tile/flow/relative0/$1/$2/$3.png?key=${TOMTOM_API_KEY}&tileSize=256;
    proxy_ssl_server_name on;
    proxy_ssl_name api.tomtom.com;
    proxy_set_header Host api.tomtom.com;
    # If your TomTom key is domain-restricted (allow-listed to a referer), set
    # ${TOMTOM_REFERER} to a matching origin so the browser's actual origin
    # never matters. Leave it blank for an unrestricted key.
    proxy_set_header Referer "${TOMTOM_REFERER}";
    proxy_read_timeout 10s;
    proxy_hide_header Set-Cookie;
    # traffic goes stale fast, short browser cache only
    add_header Cache-Control "public, max-age=60";
  }

  # Current-speed vs free-flow at a point (TomTom Flow Segment Data), used to
  # traffic-evaluate OSRM routes and rank alternatives. Client rounds coords to
  # 3 decimals (~100 m) so the 120 s cache absorbs repeat lookups.
  location ~ ^/traffic-flow/(-?[0-9.]+),(-?[0-9.]+)$ {
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $tomtom api.tomtom.com;
    proxy_pass https://$tomtom/traffic/services/4/flowSegmentData/relative0/10/json?point=$1,$2&key=${TOMTOM_API_KEY}&unit=KMPH;
    proxy_ssl_server_name on;
    proxy_ssl_name api.tomtom.com;
    proxy_set_header Host api.tomtom.com;
    proxy_set_header Referer "${TOMTOM_REFERER}";
    proxy_read_timeout 10s;
    proxy_cache tomtomflow;
    proxy_cache_key "$1,$2";
    proxy_cache_valid 200 120s;
    add_header Cache-Control "public, max-age=60";
  }

  # Real 3D-terrain DEM, public AWS/Mapzen Terrain Tiles (terrarium-encoded,
  # z0-15, global, no key). Same lazy-DNS resolver pattern as TomTom so nginx
  # boots fine offline (terrain just no-ops until the internet is reachable).
  location ~ ^/terrarium/(\d+)/(\d+)/(\d+)\.png$ {
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $awsdem s3.amazonaws.com;
    proxy_pass https://$awsdem/elevation-tiles-prod/terrarium/$1/$2/$3.png;
    proxy_ssl_server_name on;
    proxy_ssl_name s3.amazonaws.com;
    proxy_set_header Host s3.amazonaws.com;
    proxy_read_timeout 15s;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "public, max-age=604800";   # DEM is static, cache hard
  }

  # National Weather Service alerts (api.weather.gov), same-origin so the browser
  # never calls NWS directly, and we attach the required User-Agent + geo+json
  # Accept. Lazy-DNS resolver + rewrite (variable proxy_pass needs the rewrite to
  # strip the /nws/ prefix). Short browser cache; the app repolls every few min.
  # NWS asks callers to identify themselves. Set ${NWS_USER_AGENT} to an app
  # name + contact you control (e.g. "myapp (you@example.com)").
  location /nws/ {
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $nws api.weather.gov;
    rewrite ^/nws/(.*)$ /$1 break;
    proxy_pass https://$nws;
    proxy_ssl_server_name on;
    proxy_ssl_name api.weather.gov;
    proxy_set_header Host api.weather.gov;
    proxy_set_header User-Agent "${NWS_USER_AGENT}";
    proxy_set_header Accept "application/geo+json";
    proxy_read_timeout 20s;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "public, max-age=120";
  }

  # ---- Places (POI) search ----
  # Self-hosted Overpass over an OSM extract (primary; 502s until the import
  # finishes, then the app prefers it). POST Overpass QL. Point
  # ${OVERPASS_UPSTREAM} at your Overpass API host.
  location = /overpass {
    proxy_pass http://${OVERPASS_UPSTREAM}/api/interpreter;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;
  }
  # TomTom nearbySearch fallback, server-side key + referer, lazy-DNS resolver
  # so nginx boots offline. Frontend passes lat/lon/radius/categorySet/limit as
  # query args; we append the key.
  location = /poi {
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $ttpoi api.tomtom.com;
    proxy_pass https://$ttpoi/search/2/nearbySearch/.json?$args&key=${TOMTOM_API_KEY};
    proxy_ssl_server_name on;
    proxy_ssl_name api.tomtom.com;
    proxy_set_header Host api.tomtom.com;
    proxy_set_header Referer "${TOMTOM_REFERER}";
    proxy_read_timeout 12s;
  }
  # Free-text POI search near a point (TomTom categorySearch), for "gas",
  # "coffee", "walmart" typed in the search box. Frontend sends the term in the
  # path as <query>.json; we append lat/lon/radius/limit args + the key.
  location ~ ^/poi-search/(.+)$ {
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $ttps api.tomtom.com;
    proxy_pass https://$ttps/search/2/poiSearch/$1?$args&key=${TOMTOM_API_KEY};
    proxy_ssl_server_name on;
    proxy_ssl_name api.tomtom.com;
    proxy_set_header Host api.tomtom.com;
    proxy_set_header Referer "${TOMTOM_REFERER}";
    proxy_read_timeout 12s;
  }

  # ---- Voice: same-origin proxies to an optional voice/LLM stack so the browser
  # never talks to those services directly. Piper (or any) TTS + Whisper STT +
  # an Ollama-compatible LLM for spoken turn prompts, voice destination search,
  # and natural-language destination understanding. All optional. Leave the
  # WAYFINDER_VOICE feature off if you don't run these.

  # Text-to-speech (Piper via an HTTP bridge). POST {text} -> JSON {audio:b64}.
  location = /tts {
    proxy_pass http://${TTS_UPSTREAM}/synthesize;
    proxy_set_header Host $host;
    proxy_read_timeout 60s;                 # synth can be slow under GPU load
  }

  # Speech-to-text (Whisper ASR webservice). POST multipart audio_file; the app
  # passes ?task=transcribe&output=json&language=en. Allow a big-ish upload.
  location = /stt {
    proxy_pass http://${STT_UPSTREAM}/asr;   # exact-match location auto-appends ?args
    proxy_set_header Host $host;
    client_max_body_size 12m;
    proxy_read_timeout 60s;
  }

  # LLM (Ollama-compatible), normalize a spoken phrase into a search query.
  # Only used for voice search, always behind a client-side timeout + fallback.
  location = /llm {
    proxy_pass http://${LLM_UPSTREAM}/api/generate;
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  # Glyph pbfs live under folders whose names contain SPACES ("Noto Sans
  # Regular"). The SPA `try_files` below is space-delimited, so those requests
  # were split into bogus targets and fell through to index.html. MapLibre then
  # floods "Unimplemented type: 4" trying to parse HTML as protobuf. Serve the
  # fonts directly (default static handler, no try_files) so ranges 200 or 404.
  location /vendor/fonts/ {
    add_header Cache-Control "public, max-age=604800";
  }

  # App code must always revalidate. Without Cache-Control, browsers apply
  # heuristic caching and keep running WEEK-old app.js after deploys (users
  # "don't see" shipped features). ETag/304 keeps revalidation cheap on LAN.
  location ~* \.(?:js|mjs|css|html)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # SPA (fallback to index.html)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
