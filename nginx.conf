# Wayfinder — serve the SPA and proxy every geo backend under this origin
# (same-origin => no browser CORS, no dependency on public DNS). Literal IPs
# only, so nginx never blocks on upstream DNS at startup. The one internet
# upstream (TomTom traffic) uses the resolver-variable pattern so a dead DNS /
# upstream can never take the server down at boot.
#
# This file is an envsubst TEMPLATE (nginx docker entrypoint): ${TOMTOM_API_KEY}
# is substituted from the container environment at startup. nginx runtime vars
# ($host, $uri, $1…) are untouched — envsubst only replaces defined env vars.

# Short-TTL cache for TomTom flow-segment lookups: route evaluation samples
# many nearby points; caching per rounded coordinate keeps daily API usage low.
proxy_cache_path /var/cache/nginx/tomtomflow levels=1:2 keys_zone=tomtomflow:2m max_size=20m inactive=10m;

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # tiles are big & immutable-ish; let the browser cache hard
  location /tiles/ {
    proxy_pass https://192.168.1.198/;
    proxy_set_header Host tiles.masszerofpv.com;
    proxy_ssl_server_name on;
    proxy_ssl_name tiles.masszerofpv.com;
    proxy_ssl_verify off;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "public, max-age=604800";
  }

  # Martin vector tiles (.198) — planet basemap whose `buildings` layer carries
  # height/min_height for 3D fill-extrusion. Reached via the .198 nginx-proxy vhost.
  location /martin/ {
    proxy_pass https://192.168.1.198/;
    proxy_set_header Host martin.masszerofpv.com;
    proxy_ssl_server_name on;
    proxy_ssl_name martin.masszerofpv.com;
    proxy_ssl_verify off;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "public, max-age=604800";
  }

  # Photon offline geocoder on the Nomad host. Generous timeout: while the
  # Nominatim import runs, Photon's disk is contended and responses can take
  # 10-20s — better slow suggestions than timeouts.
  location /geocode/ {
    proxy_pass http://192.168.1.88:2322/;
    proxy_set_header Host $host;
    proxy_read_timeout 45s;
  }

  # OSRM routing engine (route + trip) — North America dataset on the Nomad host
  # (osrm_na:5001). Falls back conceptually to .198:5000 (regional) if ever needed.
  location /route/ {
    proxy_pass http://192.168.1.88:5001/;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
  }

  # Live traffic overlay — TomTom raster flow tiles (free tier: 50k tiles/day).
  # Same-origin so the API key never reaches the browser; key comes from the
  # container env (TOMTOM_API_KEY). Variable upstream + resolver = lazy DNS,
  # so nginx starts fine offline; the toggle just gets errors until reachable.
  location ~ ^/traffic/(\d+)/(\d+)/(\d+)\.png$ {
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $tomtom api.tomtom.com;
    proxy_pass https://$tomtom/traffic/map/4/tile/flow/relative0/$1/$2/$3.png?key=${TOMTOM_API_KEY}&tileSize=256;
    proxy_ssl_server_name on;
    proxy_ssl_name api.tomtom.com;
    proxy_set_header Host api.tomtom.com;
    # The TomTom key is domain-restricted (allow-list: quasarke.net /
    # masszerofpv.com apex); present a matching Referer server-side so the
    # browser's actual origin never matters.
    proxy_set_header Referer "https://quasarke.net/";
    proxy_read_timeout 10s;
    proxy_hide_header Set-Cookie;
    # traffic goes stale fast — short browser cache only
    add_header Cache-Control "public, max-age=60";
  }

  # Current-speed vs free-flow at a point (TomTom Flow Segment Data) — used to
  # traffic-evaluate OSRM routes and rank alternatives. Client rounds coords to
  # 3 decimals (~100 m) so the 120 s cache absorbs repeat lookups.
  location ~ ^/traffic-flow/(-?[0-9.]+),(-?[0-9.]+)$ {
    resolver 1.1.1.1 8.8.8.8 valid=300s ipv6=off;
    set $tomtom api.tomtom.com;
    proxy_pass https://$tomtom/traffic/services/4/flowSegmentData/relative0/10/json?point=$1,$2&key=${TOMTOM_API_KEY}&unit=KMPH;
    proxy_ssl_server_name on;
    proxy_ssl_name api.tomtom.com;
    proxy_set_header Host api.tomtom.com;
    proxy_set_header Referer "https://quasarke.net/";
    proxy_read_timeout 10s;
    proxy_cache tomtomflow;
    proxy_cache_key "$1,$2";
    proxy_cache_valid 200 120s;
    add_header Cache-Control "public, max-age=60";
  }

  # App code must always revalidate — without Cache-Control, browsers apply
  # heuristic caching and keep running WEEK-old app.js after deploys (users
  # "don't see" shipped features). ETag/304 keeps revalidation cheap on LAN.
  location ~* \.(?:js|mjs|css|html)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # SPA (fallback to index.html)
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
